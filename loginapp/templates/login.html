{% load static %}
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="container">

    <h2>Login Page</h2>

    <form method="POST">

        {% csrf_token %}

        <input type="text" name="username" placeorder="Enter Username">

        <input type="password" name="password" placeorder="Enter Password">

        <button type="submit">Login</button>

    </form>

    <p>{{ message }}</p>
    <p>
        <a href="/register/">New registration</a>
    </p>
    {% if error %}
        <p style="color:red">{{ error }}</p>
    {% endif %}
   
</div>

</body>
</html>
