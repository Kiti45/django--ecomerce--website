<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f6fc;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:500px;
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
            box-shadow:0px 0px 15px rgba(0,0,0,0.2);
        }

        h1{
            color:green;
            margin-bottom:20px;
        }

        h3{
            color:#333;
            margin-bottom:15px;
        }

        p{
            font-size:18px;
            margin-bottom:15px;
        }

        .payment{
            color:blue;
            font-weight:bold;
        }

        .btn{
            display:inline-block;
            margin-top:20px;
            padding:12px 25px;
            background:#007bff;
            color:white;
            text-decoration:none;
            border-radius:5px;
            margin-right:10px;
        }

        .btn:hover{
            background:#0056b3;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>✅ Order Placed Successfully</h1>

    <h3>Thank You for Shopping With Us</h3>

    <p>Your order has been placed successfully.</p>

    <p>
        Payment Method :
        <span class="payment">
            {{ payment }}
        </span>
    </p>

    <p>Your order will be delivered soon.</p>

    <a href="{% url 'home' %}" class="btn">Home</a>

    <a href="{% url 'home' %}" class="btn">Continue Shopping</a>

</div>

</body>
</html>
