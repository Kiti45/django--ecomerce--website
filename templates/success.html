<!DOCTYPE html>
<html>
<head>
    <title>Registration Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 80px;
        }

        .success-box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            color: green;
        }

        .details {
            background-color: #f5f5f5;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }

        .details p {
            font-size: 18px;
        }

        .value {
            font-weight: bold;
            color: #333;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <h2>Registration Successful! 🎉</h2>

        <p>Your account has been created successfully.</p>

        <div class="details">

            <p>
                <strong>Username:</strong>
                <span class="value">{{ username }}</span>
            </p>

            <p>
                <strong>Password:</strong>
                <span class="value">{{ password }}</span>
            </p>

        </div>

        <p>Please save your username and password.</p>

        <button onclick="window.location.href='/'">
            Go to Home
        </button>

    </div>

</body>
</html>
